[run]
name = "_pretrain_256x12_film"

[train]
max_epochs        = 3100
steps_per_segment = 5
max_cases         = 65000
ic_max_n          = 1024
n_val             = 5000
save_interval_sec = 1800
warmup_epochs     = 50
grad_balance_every = 10
grad_balance_batches = 3
grad_balance_drift = 0.69
grad_balance_min_every = 2
grad_balance_max_every = 25
grad_scale_max    = 100.0
val_interval      = 5
rollout_interval  = 30
extrap_sched_interval = 25
rollout_cases     = 100
extrap_cases      = 50
extrap_t_ext      = 8.0
extrap_rk4_dt     = 1.0e-4

roll_robust_kind    = "huber"
roll_activate_delay = 200
roll_ramp_epochs    = 150
roll_cases          = 256
roll_depth_max      = 19
roll_points         = 12
roll_depth_ramp_epochs = 25
roll_draws          = 4
roll_median_ema     = 0.9

kin_ramp_epochs   = 40
ema_decay         = 0.999

phys_ramp_center  = 30
phys_ramp_width   = 10

lr_drop_epoch     = 55
lr_drop_to        = 1.0e-4

[net]
fourier_l = 32
f_min     = 0.2
f_max     = 20.0
width     = 256
n_blocks  = 12
param_embed_dim = 32
film_hidden = 128

hard_ic   = "c1"

[optimizer]
lr            = 1e-3
weight_decay  = 1e-4
grad_clip     = 1.0

[ode_scheduler]
patience        = 80
factor          = 0.8
min_lr          = 5e-6
phase2_lr       = 5.0e-4
max_veto_epochs = 160
rel_tol_val     = 4e-4
rel_tol_ext     = 4e-4
rel_tol_roll    = 4e-4
patience_val    = 20
patience_ext    = 50
patience_roll   = 30
ema_beta_val    = 0.9
ema_beta_ext    = 0.9
ema_beta_roll   = 0.8

[lambda]
ic      = 1.0
data    = 1.0
kin     = 1.0
phys    = 1.0
energy  = 1.0
roll    = 0.8

[colloc]
n_colloc          = 20480
ic_sigma          = 0.03
ic_sigma_warmup   = 200

[data]
g            = 9.81
t_data_max   = 5.0
march_dt     = 0.25
energy_eps   = 0.01
phys_eps     = 10.0
batch_size   = 16384
colloc_chunk = 4096
nonflip_path = "data/nonflip_RK4_0_5s_70k.npy"
scaler_name  = "scaler.npy"
scaler_extra_omega = "data/mixed_RK4_0_5s_25flip.npy"
