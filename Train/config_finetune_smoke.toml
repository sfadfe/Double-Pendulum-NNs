[train]
adapter_only      = true   # 본 finetune과 동일 — freeze + trainable-only 옵티마이저 경로 검증
max_epochs        = 5      # phase1(0-1) → phys(2) → roll(3-4) — 본 런과 같은 활성화 순서
steps_per_segment = 2
max_cases         = 40
n_val             = 30
n_colloc_cases    = 40
replay_frac       = 0.0   # replay 에폭은 nonflip-only라 adapter/gate 경로가 안 돌아감 — 스모크는 mixed 에폭이어야 함
save_interval_sec = 99999
warmup_epochs     = 2      # 본 런과 동일 — phase1을 건너뛰면 compile 그래프 생성 순서가 달라진다
grad_balance_every = 10
grad_balance_batches = 1
val_interval      = 999
rollout_interval  = 999
rollout_cases     = 20
extrap_cases      = 0
save_rollout_best = false
roll_robust_kind    = "huber"  # 본 finetune과 동일 — _RobustRollMean Huber 분기 검증
roll_activate_epoch = 3
roll_ramp_epochs    = 1
roll_cases          = 20
roll_depth_max      = 2
roll_points         = 4

[net]
fourier_l = 32
f_min     = 0.2
f_max     = 20.0   # pretrain(2026_08_02)과 동일
width     = 384
n_blocks  = 6
param_embed_dim = 32
cond_mode   = "film"   # pretrain(2026_08_18_12_58_30)과 일치 — FiLM+adapter 동시 경로 검증
film_hidden = 128
hard_ic   = "c1"   # 로드할 pretrain ckpt와 일치해야 한다 (Trainer._CheckHardIC가 막는다)
energy_gate      = true   # 본 finetune과 동일하게 — _AdaptState zero-pad 경로(103→104)를 스모크가 검증해야 함
flip_adapter_dim = 128
flip_adapter_n   = 2
gate_sparse      = true
gate_eps         = 0.05

[optimizer]
lr            = 5e-5
weight_decay  = 1e-4
grad_clip     = 1.0

[ode_scheduler]
patience = 60
factor   = 0.85
min_lr   = 1e-6

[lambda]
ic      = 1.0
data    = 1.0
kin     = 1.0
phys    = 1.0
energy  = 0.8
roll    = 0.8   # Huber 경로가 실제 backward까지 타야 함

[colloc]
n_colloc          = 20480  # 본 런과 동일 shape — phys 컴파일 그래프를 4096 청크로 정확히 재현
n_colloc_cases    = 40
colloc_flip_bias  = 0.5
ic_sigma          = 0.03   # 본 finetune과 동일
ic_sigma_warmup   = 1

[data]
g            = 9.81
t_data_max   = 5.0
march_dt     = 0.25  # pretrain(2026_08_18_12_58_30)·본 finetune과 동일. 다르면 t_norm/RFF 기준이 어긋난다
energy_eps   = 0.01
phys_eps     = 1.0
batch_size   = 4096  # 본 런과 동일 shape
colloc_chunk = 4096
nonflip_path = "data/nonflip_RK4_0_5s.npy"
data_path    = "data/mixed_RK4_0_5s_25flip.npy"   # mixed_smoke.npy는 없다. max_cases 40으로 줄여 쓴다
scaler_name  = "scaler.npy"
