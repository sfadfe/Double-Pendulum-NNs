[train]
max_epochs       = 2500
steps_per_segment = 20
max_cases        = 10000
n_val            = 5000
save_interval_sec = 1800   # 체크포인트 저장 주기 (초)
warmup_epochs     = 9       # data-only 워밍업 에폭 수 // ODE 계산 시작 전 구간
use_grad_balance = true     # B(grad-norm 균등화) on/off // false면 grad_scale=1.0 고정, ReLoBRaLo 단독 (ablation)
grad_balance_every = 10     # B(grad-norm 균등화) 갱신 주기 (에폭) // EMA 교체로 계단 외란 제거 → 10에폭 주기 안전 + scale 신선도 최대화
grad_balance_batches = 3    # B 측정 시 세그먼트당 배치 수 (노름 평균으로 노이즈 완화)
val_interval      = 10     # val 계산 주기 (에폭)
rollout_interval = 75      # rollout 계산 주기 (에폭)
rollout_cases    = 100     # rollout에 사용할 케이스 수
extrap_cases     = 50      # extrapolation 평가 케이스 수 // 외삽 GT 한 번 precompute (val_cases 앞쪽)
extrap_t_ext     = 8.0     # 마칭 외삽 종료 시각 (s) // t_data_max 이후 구간이 외삽
extrap_rk4_dt    = 1.0e-4  # 외삽 GT용 RK4 스텝 // 학습 중 모니터용(정밀평가는 Test/extrapolate.py)

# rollout-aware (pushforward) 손실 // 윈도우 핸드오프 ω 누적오차 교정
# 게이트는 고정 에폭 아님: 스케줄러 활성화(ODE가 activate_threshold 돌파 → LR ratchet 시작) 후에만 켬
# 조기 도입은 활성화 자체를 막아 LR이 1e-3에 고정됨 (2026_06_21 run 교훈)
roll_activate_delay = 200  # 활성화 후 roll 켜기까지 대기 에폭 (LR 몇 번 ratchet될 여유)
roll_ramp_epochs    = 150  # roll 가중치 0→1 선형 램프 길이 (충격 방지)
roll_cases       = 256     # 스텝당 rollout 케이스 수 (0이면 비활성)
roll_depth_max   = 6       # [EXP handoff] 3→6: 더 긴 누적 체인 노출 // no_grad 마칭 깊이 상한, depth∈[1,max] 매 스텝 랜덤
roll_points      = 12      # grad 윈도우에서 데이터 매칭할 시간점 수 (끝점 포함)

[net]
fourier_l = 24
f_min     = 0.2    # Hz, 최저 주파수
f_max     = 48.0   # Hz, 최고 주파수
width     = 256    # hidden layer 너비
n_blocks  = 4      # ResidualBlock 수

[optimizer]
lr            = 1e-3
weight_decay  = 1e-4
grad_clip     = 1.0
warmup_steps  = 50

[ode_scheduler]
ema_beta           = 0.92
patience           = 80
patience_decay     = 0.8    # LR 감쇄마다 patience에 곱할 비율 // ratchet-down acceleration
min_patience       = 50     # 25→50: 각 LR 단계 체류 연장 // 기존 런은 640→2019 사이 ~55회 감쇄로 과도
rel_tol            = 0.3
rel_tol_decay      = 0.85   # LR 감쇄마다 rel_tol에 곱할 비율 // coarser --> finer tolerance as training progresses
factor             = 0.85
min_lr             = 1e-6   # 1e-7→1e-6: 그 밑에선 학습이 사실상 없음 (exp_handoff 로그 근거)
activate_threshold = 0.15

# Warm restart: 무개선 감쇄가 연속되면 LR을 생산적 대역으로 복원 // 단방향 ratchet의 LR≈0 공회전 제거
min_rel_tol      = 0.005    # rel_tol 하한 + 감쇄 생산성(직전 감쇄 이후 best_ema 개선) 판정 기준
max_bad_decays   = 4        # 연속 4회 무개선 감쇄 → restart // patience 하한 50 기준 ~200에폭 확인 후
restart_lr0      = 1e-4     # 첫 restart 복원 LR // 기존 런에서 extrap이 실제로 개선되던 대역
restart_decay    = 0.5      # restart마다 복원 LR ×0.5 // SGDR 진폭 감쇄 → 전체적으로는 anneal 유지
restart_cooldown = 30       # restart 직후 stall 동결 에폭 // EMA 과도응답을 정체로 오판 방지

[lambda]
ic              = 1.0
data            = 1.0
kin             = 1.0
phys            = 1.0
energy          = 1.0    # B 도입 전 보호값 (진단상 energy는 약자) // B가 잡으면 무의미하나 안전마진
roll            = 0.8    # [EXP handoff] 0.5→0.8: 핸드오프 교정 비중 상향 // rollout-aware base 가중치 (B가 roll grad-norm 미측정 → 직접 캡)
lambda_min      = 0.3    # ReLoBRaLo λ_relo clamp 하한 // B가 절대 스케일 담당
lambda_max      = 3.0    # ReLoBRaLo λ_relo clamp 상한
relobralo_tau   = 0.3    # softmax temperature // 낮을수록 수렴 속도 차이에 민감
relobralo_alpha = 0.95   # EMA smoothing // 클수록 lambda 변화 느림 (TC≈20에폭)

[colloc]
seg_count    = 3
overlap_frac = 0.15
n_colloc     = 10000
rar_top_frac = 0.2
rar_bot_frac = 0.2
rar_every    = 200
ic_sigma        = 0.03   # [EXP handoff] 0.0→0.03: off-manifold σ-볼에서 물리 유효화 // Phase 3 콜로케이션 IC 섭동 target
ic_sigma_warmup = 200    # sigma 0→target 선형 램프 에폭 (Phase 2 진입 후)

[data]
g            = 9.81
t_data_max   = 5.0
march_dt     = 1.0
energy_eps   = 1e-3
phys_eps     = 1.0     # relative residual denom floor
batch_size   = 4096
nonflip_path = "data/nonflip_RK4_0_5s.npy"
scaler_name  = "scaler.npy"
